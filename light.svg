<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bgGradLight)" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- scanline -->
  <rect x="0" y="0" width="900" height="3" fill="#7c3aed" opacity="0.35">
    <animate attributeName="y" values="0;217;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal top bar -->
  <circle cx="26" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="6" fill="#27c93f"/>
  <text x="90" y="29" font-family="JetBrains Mono, monospace" font-size="13" fill="#8a92a6">ali-irtza@dev:~$</text>

  <!-- ASCII-styled name -->
  <text x="450" y="105" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="46" font-weight="700"
        fill="url(#textGradLight)" letter-spacing="4">ALI IRTZA</text>

  <text x="450" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#4b5468" letter-spacing="2">
    &gt; AI/ML Engineer &amp; Full-Stack Builder
    <animate attributeName="opacity" values="1;1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor -->
  <rect x="615" y="128" width="10" height="16" fill="#7c3aed">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6b7280" letter-spacing="1">
    [ Python · FastAPI · LLMs · RAG · Next.js · Supabase ]
  </text>

  <line x1="60" y1="196" x2="840" y2="196" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="1"/>
</svg>
