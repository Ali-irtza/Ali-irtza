<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0d0208"/>
    </linearGradient>
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00b32d"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bgGradDark)" stroke="#00FF41" stroke-opacity="0.35" stroke-width="1.5"/>

  <rect x="0" y="0" width="900" height="3" fill="#00FF41" opacity="0.5">
    <animate attributeName="y" values="0;217;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <circle cx="26" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="6" fill="#27c93f"/>
  <text x="90" y="29" font-family="JetBrains Mono, monospace" font-size="13" fill="#4a5545">ali-irtza@dev:~$</text>

  <text x="450" y="105" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="46" font-weight="700"
        fill="url(#textGradDark)" filter="url(#glowDark)" letter-spacing="4">ALI IRTZA</text>

  <text x="450" y="140" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#5fae5f" letter-spacing="2">
    &gt; AI/ML Engineer &amp; Full-Stack Builder
    <animate attributeName="opacity" values="1;1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <rect x="615" y="128" width="10" height="16" fill="#00FF41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#3d7a3d" letter-spacing="1">
    [ Python · FastAPI · LLMs · RAG · Next.js · Supabase ]
  </text>

  <line x1="60" y1="196" x2="840" y2="196" stroke="#00FF41" stroke-opacity="0.2" stroke-width="1"/>
</svg>
