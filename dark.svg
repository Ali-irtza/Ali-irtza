<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <!--
    ============================================================
    HOW TO CHANGE COLORS
    Edit ONLY the hex values inside the root block below.
    Every shape in this banner references those variables.
    ============================================================
  -->
  <style>
    :root {
      --bg-start: #1a0505;
      --bg-end: #0a0303;
      --accent: #ff2e4d;
      --accent-2: #ff7a8a;
      --accent-3: #b3001b;
      --text-bright: #ffe9ea;
      --text-muted: #9a6468;
      --line-soft: #401318;
      --skin: #f0c8a0;
      --blush: #ff8a93;
      --hair: #14100d;
      --hoodie: #211a1b;
      --hoodie-dark: #171213;
      --hoodie-trim: #ff2e4d;
      --plant: #3fae5a;
      --pot: #2a1416;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .muted-fill { fill: var(--text-muted); }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-start)"/>
      <stop offset="100%" stop-color="var(--bg-end)"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-2)"/>
      <stop offset="50%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent-3)"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="var(--accent-2)"/>
      <stop offset="100%" stop-color="var(--accent-3)"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameClip">
      <rect x="0" y="90" width="0" height="90">
        <animate attributeName="width" values="0;430;430" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- faint circuit grid texture -->
  <g stroke="var(--accent)" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="1000" height="3" fill="var(--accent)" opacity="0.4">
    <animate attributeName="y" values="0;317;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal top bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="94" y="33" class="mono muted-fill" font-size="13">ali-irtza@dev:~$</text>

  <!-- live status pulse, top right -->
  <g class="mono" font-size="12" fill="var(--text-muted)">
    <circle cx="922" cy="28" r="5" fill="var(--accent)">
      <animate attributeName="r" values="4;6.5;4" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="922" cy="28" r="9" fill="none" stroke="var(--accent)" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="6;14" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="936" y="32">shipping</text>
  </g>

  <!-- floating tech symbols -->
  <g class="mono" font-size="18" fill="var(--accent)" opacity="0.3">
    <text x="540" y="60">&lt;/&gt;
      <animate attributeName="y" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.45;0.12" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="900" y="80">{ }
      <animate attributeName="y" values="80;60;80" dur="5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0.12;0.4;0.12" dur="5s" repeatCount="indefinite" begin="0.7s"/>
    </text>
    <text x="640" y="270">01
      <animate attributeName="y" values="270;250;270" dur="4.5s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="4.5s" repeatCount="indefinite" begin="1.1s"/>
    </text>
    <text x="960" y="230">;
      <animate attributeName="y" values="230;210;230" dur="3.6s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="3.6s" repeatCount="indefinite" begin="0.3s"/>
    </text>
  </g>

  <!-- signature element: quiet heartbeat pulse-line running under the left copy -->
  <path d="M42 248 L150 248 L162 232 L174 264 L188 240 L200 248 L470 248"
        fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.35" filter="url(#softGlow)">
    <animate attributeName="stroke-dasharray" values="0,900;900,0" dur="3.2s" repeatCount="indefinite"/>
  </path>

  <!-- LEFT: name + tagline -->
  <g clip-path="url(#nameClip)">
    <text x="40" y="150" class="mono" font-size="64" font-weight="700"
          fill="url(#nameGrad)" filter="url(#softGlow)" letter-spacing="2">ALI IRTZA</text>
  </g>
  <rect x="40" y="105" width="4" height="55" fill="var(--accent-2)">
    <animate attributeName="x" values="40;470;40" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <text x="42" y="195" class="mono" font-size="18" fill="var(--accent-2)" letter-spacing="1">
    &gt; AI/ML Engineer &amp; Full-Stack Builder
  </text>

  <!-- rotating git-commit style log lines -->
  <g class="mono" font-size="14" fill="var(--text-muted)">
    <text x="42" y="225" opacity="0">
      <tspan fill="var(--accent-2)">a3f9c2</tspan> · feat: shipped a RAG pipeline
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.35" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="225" opacity="0">
      <tspan fill="var(--accent-2)">7c1e4a</tspan> · perf: optimized FastAPI routes
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.65;0.7" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="225" opacity="0">
      <tspan fill="var(--accent-2)">e9b024</tspan> · chore: deployed Next.js UI
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="42" y1="250" x2="470" y2="250" stroke="var(--line-soft)" stroke-width="1"/>
  <text x="42" y="275" class="mono" font-size="13" fill="var(--text-muted)" letter-spacing="1">
    [ Python · FastAPI · LLMs · RAG · Next.js · Supabase ]
  </text>

  <!-- RIGHT: desk scene -->
  <g>
    <!-- desk -->
    <rect x="590" y="252" width="370" height="10" rx="2" fill="var(--line-soft)"/>
    <rect x="612" y="262" width="8" height="30" fill="var(--bg-end)"/>
    <rect x="928" y="262" width="8" height="30" fill="var(--bg-end)"/>

    <!-- chair -->
    <path d="M700 260 L700 165 Q700 132 780 130 Q860 132 860 165 L860 260 Z"
          fill="var(--hoodie-dark)" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="705" cy="200" r="7" fill="var(--hoodie-dark)" stroke="var(--accent)" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="855" cy="200" r="7" fill="var(--hoodie-dark)" stroke="var(--accent)" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- torso / hoodie, wide shoulders visible either side of the laptop -->
    <path d="M706 260 Q702 220 726 202 Q750 188 780 188 Q810 188 834 202 Q858 220 854 260 Z"
          fill="var(--hoodie)" stroke="var(--hoodie-trim)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- arms to keyboard -->
    <path d="M732 206 Q708 214 700 236" stroke="var(--hoodie)" stroke-width="18" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M732 206 Q708 214 700 236;M732 206 Q708 212 700 234;M732 206 Q708 214 700 236" dur="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M828 206 Q852 214 860 236" stroke="var(--hoodie)" stroke-width="18" stroke-linecap="round" fill="none">
      <animate attributeName="d" values="M828 206 Q852 214 860 236;M828 206 Q852 212 860 234;M828 206 Q852 214 860 236" dur="0.6s" repeatCount="indefinite" begin="0.3s"/>
    </path>

    <!-- head + hood -->
    <g>
      <path d="M736 190 Q724 138 780 124 Q836 138 824 190 Q824 214 780 222 Q736 214 736 190 Z"
            fill="var(--hoodie)" stroke="var(--hoodie-trim)" stroke-width="2.5" stroke-opacity="0.7"/>
      <!-- drawstrings -->
      <path d="M754 205 Q749 216 752 228" stroke="var(--hoodie-trim)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M806 205 Q811 216 808 228" stroke="var(--hoodie-trim)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <circle cx="752" cy="228" r="2.5" fill="var(--hoodie-trim)"/>
      <circle cx="808" cy="228" r="2.5" fill="var(--hoodie-trim)"/>

      <!-- face -->
      <circle cx="780" cy="172" r="37" fill="var(--skin)"/>
      <circle cx="780" cy="172" r="37" fill="url(#faceGlow)"/>

      <!-- bangs peeking from hood -->
      <path d="M747 158 Q750 136 774 132 Q764 144 763 160 Q754 162 747 158 Z" fill="var(--hair)"/>
      <path d="M813 158 Q810 136 786 132 Q796 144 797 160 Q806 162 813 158 Z" fill="var(--hair)"/>
      <path d="M763 138 Q780 128 797 138 Q789 146 780 148 Q771 146 763 138 Z" fill="var(--hair)"/>

      <!-- inner hood rim shading -->
      <path d="M744 172 Q744 138 780 132 Q816 138 816 172 Q816 196 780 206 Q744 196 744 172 Z"
            fill="none" stroke="var(--hoodie-trim)" stroke-width="2" stroke-opacity="0.3"/>

      <!-- blush -->
      <circle cx="757" cy="182" r="5.5" fill="var(--blush)" opacity="0.5"/>
      <circle cx="803" cy="182" r="5.5" fill="var(--blush)" opacity="0.5"/>

      <!-- big eyes -->
      <ellipse cx="765" cy="174" rx="5.5" ry="7" fill="#221213"/>
      <ellipse cx="795" cy="174" rx="5.5" ry="7" fill="#221213"/>
      <circle cx="767" cy="170.5" r="1.8" fill="#fff" opacity="0.95"/>
      <circle cx="797" cy="170.5" r="1.8" fill="#fff" opacity="0.95"/>

      <!-- happy open mouth -->
      <path d="M770 193 Q780 200 790 193 Q784 197 780 197 Q776 197 770 193 Z" fill="#7a3020" opacity="0.85"/>
    </g>

    <!-- laptop: keyboard base + screen, sized to sit below the chin -->
    <path d="M714 238 L846 238 L836 254 L724 254 Z" fill="var(--hoodie-dark)" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M722 238 L838 238 L832 196 L728 196 Z" fill="#150a0b" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M726 234 L834 234 L829 200 L731 200 Z" fill="url(#screenGlow)" opacity="0.92" filter="url(#bigGlow)"/>

    <!-- animated code lines on screen -->
    <g fill="#2a0708" opacity="0.85">
      <rect x="734" y="207" width="30" height="3" rx="1.5">
        <animate attributeName="width" values="10;40;30;10" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="734" y="214" width="50" height="3" rx="1.5">
        <animate attributeName="width" values="55;20;55" dur="2.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="734" y="221" width="35" height="3" rx="1.5">
        <animate attributeName="width" values="20;45;20" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="734" y="228" width="55" height="3" rx="1.5">
        <animate attributeName="width" values="55;25;55" dur="2.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M722 238 L838 238 L832 196 L728 196 Z" fill="none" stroke="var(--accent-2)" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- hands resting on the keyboard -->
    <circle cx="726" cy="240" r="8" fill="var(--skin)">
      <animate attributeName="cy" values="240;236;240" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="834" cy="240" r="8" fill="var(--skin)">
      <animate attributeName="cy" values="240;236;240" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
    </circle>

    <!-- small potted plant -->
    <g>
      <path d="M878 252 Q874 232 884 218 Q886 236 890 252 Z" fill="var(--plant)"/>
      <path d="M890 252 Q892 228 904 212 Q900 234 898 252 Z" fill="var(--plant)"/>
      <path d="M898 252 Q902 234 914 224 Q908 240 904 252 Z" fill="var(--plant)"/>
      <path d="M876 250 h34 l-4 16 h-26 z" fill="var(--pot)" stroke="var(--accent)" stroke-opacity="0.3"/>
    </g>

    <!-- coffee cup -->
    <rect x="922" y="230" width="18" height="20" rx="3" fill="var(--hoodie-dark)" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M928 222 Q926 216 930 212" stroke="var(--text-muted)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M934 222 Q932 215 936 210" stroke="var(--text-muted)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <line x1="590" y1="290" x2="960" y2="290" stroke="var(--line-soft)" stroke-width="1"/>
</svg>
