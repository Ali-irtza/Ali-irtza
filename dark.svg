<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <!--
    ============================================================
    HOW TO CHANGE COLORS
    Edit ONLY the hex values inside the root block below, in the
    style tag right after this comment. Every shape in this
    banner references those variables, so changing one line
    there updates the whole design.

      bg start / bg end     : background gradient
      accent / accent 2     : name, glow, borders, laptop screen
      accent 3              : darker accent shade
      text muted            : tagline / faint labels
      hair / hoodie         : character colors
      skin                  : character skin tone
    ============================================================
  -->
  <style>
    :root {
      --bg-start: #0b0904;
      --bg-end: #1a130a;
      --accent: #f5a623;
      --accent-2: #ffd166;
      --accent-3: #c9820a;
      --text-bright: #fff3dc;
      --text-muted: #8a7454;
      --line-soft: #3a2c14;
      --skin: #f0c8a0;
      --hair: #171310;
      --hoodie: #23201c;
      --hoodie-trim: #f5a623;
    }
    .bg-fill { fill: var(--bg-end); }
    .accent-fill { fill: var(--accent); }
    .accent2-fill { fill: var(--accent-2); }
    .accent-stroke { stroke: var(--accent); }
    .muted-fill { fill: var(--text-muted); }
    .bright-fill { fill: var(--text-bright); }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--bg-start)"/>
      <stop offset="100%" stop-color="var(--bg-end)"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--accent-2)"/>
      <stop offset="50%" stop-color="var(--accent)"/>
      <stop offset="100%" stop-color="var(--accent-3)"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--accent-2)"/>
      <stop offset="100%" stop-color="var(--accent-3)"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="nameClip">
      <rect x="0" y="90" width="0" height="90">
        <animate attributeName="width" values="0;430;430" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="var(--accent)" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- scanline -->
  <rect x="0" y="0" width="1000" height="3" fill="var(--accent)" opacity="0.4">
    <animate attributeName="y" values="0;317;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal top bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="6" fill="#27c93f"/>
  <text x="94" y="33" class="mono muted-fill" font-size="13">ali-irtza@dev:~$</text>

  <!-- floating tech symbols -->
  <g class="mono accent-fill" font-size="18" opacity="0.3">
    <text x="540" y="60">&lt;/&gt;
      <animate attributeName="y" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.45;0.12" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="900" y="80">{ }
      <animate attributeName="y" values="80;60;80" dur="5s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="0.12;0.4;0.12" dur="5s" repeatCount="indefinite" begin="0.7s"/>
    </text>
    <text x="640" y="270">01
      <animate attributeName="y" values="270;250;270" dur="4.5s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="4.5s" repeatCount="indefinite" begin="1.1s"/>
    </text>
    <text x="960" y="230">;
      <animate attributeName="y" values="230;210;230" dur="3.6s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0.08;0.35;0.08" dur="3.6s" repeatCount="indefinite" begin="0.3s"/>
    </text>
  </g>

  <!-- LEFT: name + tagline -->
  <g clip-path="url(#nameClip)">
    <text x="40" y="150" class="mono" font-size="64" font-weight="700"
          fill="url(#nameGrad)" filter="url(#softGlow)" letter-spacing="2">ALI IRTZA</text>
  </g>
  <rect x="40" y="105" width="4" height="55" class="accent2-fill">
    <animate attributeName="x" values="40;470;40" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="0.6s" repeatCount="indefinite"/>
  </rect>

  <text x="42" y="195" class="mono" font-size="18" fill="var(--accent-2)" letter-spacing="1">
    &gt; AI/ML Engineer &amp; Full-Stack Builder
  </text>

  <g class="mono" font-size="15" fill="var(--text-muted)">
    <text x="42" y="225" opacity="0">
      Building AI-powered full-stack applications
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.35" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="225" opacity="0">
      LLMs · RAG Pipelines · Machine Learning
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.65;0.7" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="42" y="225" opacity="0">
      Next.js · FastAPI · Supabase · Python
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="42" y1="250" x2="470" y2="250" stroke="var(--line-soft)" stroke-width="1"/>
  <text x="42" y="275" class="mono" font-size="13" fill="var(--text-muted)" letter-spacing="1">
    [ Python · FastAPI · LLMs · RAG · Next.js · Supabase ]
  </text>

  <!-- RIGHT: desk scene -->
  <g>
    <!-- desk -->
    <rect x="590" y="252" width="370" height="10" rx="2" fill="var(--line-soft)"/>
    <rect x="612" y="262" width="8" height="30" fill="var(--bg-end)"/>
    <rect x="928" y="262" width="8" height="30" fill="var(--bg-end)"/>

    <!-- chair -->
    <rect x="738" y="140" width="76" height="100" rx="16" fill="#1c1712" stroke="var(--line-soft)" stroke-width="2"/>

    <!-- hunched hoodie body leaning toward laptop -->
    <path d="M726 250 Q724 190 758 165 Q800 148 828 175 Q840 200 832 250 Z"
          fill="var(--hoodie)" stroke="var(--hoodie-trim)" stroke-width="1.5" stroke-opacity="0.55"/>
    <!-- hood/collar detail -->
    <path d="M748 178 Q778 160 802 178 L794 198 Q778 205 762 198 Z" fill="#1a1712"/>

    <!-- striped shirt collar peek -->
    <path d="M766 182 L772 196 L784 196 L790 182 Z" fill="#3a3226"/>
    <line x1="769" y1="185" x2="787" y2="185" stroke="#5c503b" stroke-width="1.5"/>
    <line x1="768" y1="190" x2="788" y2="190" stroke="#5c503b" stroke-width="1.5"/>

    <!-- arms reaching down to keyboard (hunched forward) -->
    <path d="M742 210 Q718 222 708 240" stroke="var(--hoodie)" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M816 205 Q842 218 850 240" stroke="var(--hoodie)" stroke-width="17" stroke-linecap="round" fill="none"/>
    <circle cx="708" cy="242" r="7" fill="var(--skin)">
      <animate attributeName="cy" values="242;238;242" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="242" r="7" fill="var(--skin)">
      <animate attributeName="cy" values="242;238;242" dur="0.5s" repeatCount="indefinite" begin="0.25s"/>
    </circle>

    <!-- head, tilted forward/down focused on screen -->
    <g transform="rotate(8 780 145)">
      <circle cx="780" cy="145" r="36" fill="var(--skin)"/>

      <!-- messy hair -->
      <path d="M742 138 Q736 96 774 92 Q770 84 782 82 Q778 92 788 84 Q800 74 806 90 Q816 82 818 100
               Q828 96 822 116 Q830 112 824 130 Q812 118 806 128 Q800 112 790 122 Q782 108 772 120
               Q762 108 752 122 Q744 128 742 138 Z"
            fill="var(--hair)"/>
      <!-- couple of stray strands -->
      <path d="M796 86 Q804 78 802 68" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M762 96 Q754 90 754 80" stroke="var(--hair)" stroke-width="3.5" fill="none" stroke-linecap="round"/>

      <!-- glasses -->
      <circle cx="766" cy="148" r="13" fill="none" stroke="var(--hair)" stroke-width="2.5"/>
      <circle cx="796" cy="148" r="13" fill="none" stroke="var(--hair)" stroke-width="2.5"/>
      <line x1="779" y1="147" x2="783" y2="147" stroke="var(--hair)" stroke-width="2.5"/>
      <line x1="753" y1="147" x2="746" y2="145" stroke="var(--hair)" stroke-width="2.5"/>
      <line x1="809" y1="147" x2="816" y2="145" stroke="var(--hair)" stroke-width="2.5"/>
      <!-- lens glint -->
      <circle cx="762" cy="144" r="3" fill="var(--accent-2)" opacity="0.7"/>
      <circle cx="792" cy="144" r="3" fill="var(--accent-2)" opacity="0.7"/>

      <!-- focused eyes (small, looking down) -->
      <circle cx="766" cy="150" r="2.4" fill="#2a1e10"/>
      <circle cx="796" cy="150" r="2.4" fill="#2a1e10"/>

      <!-- small focused mouth -->
      <path d="M774 166 Q781 168 788 166" stroke="#b98a5c" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- ear -->
      <path d="M814 142 Q822 144 820 154 Q814 156 812 150 Z" fill="var(--skin)"/>
    </g>

    <!-- laptop -->
    <path d="M712 240 L850 240 L836 254 L726 254 Z" fill="#1c1712" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="726" y="178" width="108" height="64" rx="3" fill="#151109" stroke="var(--accent)" stroke-width="1.5"/>
    <rect x="731" y="183" width="98" height="54" rx="2" fill="url(#screenGrad)" opacity="0.9" filter="url(#bigGlow)"/>

    <!-- animated code lines on screen -->
    <g fill="#1a1206" opacity="0.85">
      <rect x="736" y="189" width="30" height="3" rx="1.5">
        <animate attributeName="width" values="10;40;30;10" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="736" y="196" width="50" height="3" rx="1.5">
        <animate attributeName="width" values="55;20;55" dur="2.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="736" y="203" width="20" height="3" rx="1.5">
        <animate attributeName="width" values="15;35;15" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="736" y="210" width="62" height="3" rx="1.5">
        <animate attributeName="width" values="62;25;62" dur="2.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="736" y="217" width="35" height="3" rx="1.5">
        <animate attributeName="width" values="20;45;20" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="736" y="224" width="45" height="3" rx="1.5">
        <animate attributeName="width" values="45;15;45" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="726" y="178" width="108" height="64" rx="3" fill="none" stroke="var(--accent-2)" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- coffee cup -->
    <rect x="868" y="230" width="18" height="20" rx="3" fill="#1c1712" stroke="var(--accent)" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M874 222 Q872 216 876 212" stroke="var(--text-muted)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M880 222 Q878 215 882 210" stroke="var(--text-muted)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <line x1="590" y1="290" x2="960" y2="290" stroke="var(--line-soft)" stroke-width="1"/>
</svg>
