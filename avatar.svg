<svg width="360" height="420" viewBox="0 0 360 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="360" height="420" rx="16" fill="#000000" stroke="#00FF41" stroke-opacity="0.4" stroke-width="1.5"/>

  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#00FF41" filter="url(#glow)" opacity="0.85">
    <!-- matrix rain columns -->
    <text x="14" y="0"><animate attributeName="y" values="-400;420" dur="3.1s" repeatCount="indefinite"/>10110</text>
    <text x="38" y="0"><animate attributeName="y" values="-380;420" dur="2.4s" repeatCount="indefinite" begin="0.3s"/>ALI</text>
    <text x="62" y="0"><animate attributeName="y" values="-420;420" dur="3.6s" repeatCount="indefinite" begin="0.6s"/>01001</text>
    <text x="86" y="0"><animate attributeName="y" values="-360;420" dur="2.8s" repeatCount="indefinite" begin="0.1s"/>RAG</text>
    <text x="110" y="0"><animate attributeName="y" values="-400;420" dur="3.3s" repeatCount="indefinite" begin="0.9s"/>11010</text>
    <text x="134" y="0"><animate attributeName="y" values="-390;420" dur="2.6s" repeatCount="indefinite" begin="0.4s"/>LLM</text>
    <text x="158" y="0"><animate attributeName="y" values="-410;420" dur="3.9s" repeatCount="indefinite" begin="1.2s"/>00110</text>
    <text x="182" y="0"><animate attributeName="y" values="-370;420" dur="2.9s" repeatCount="indefinite" begin="0.2s"/>PY</text>
    <text x="206" y="0"><animate attributeName="y" values="-400;420" dur="3.2s" repeatCount="indefinite" begin="0.7s"/>10011</text>
    <text x="230" y="0"><animate attributeName="y" values="-380;420" dur="2.5s" repeatCount="indefinite" begin="1.0s"/>SQL</text>
    <text x="254" y="0"><animate attributeName="y" values="-420;420" dur="3.7s" repeatCount="indefinite" begin="0.5s"/>01101</text>
    <text x="278" y="0"><animate attributeName="y" values="-360;420" dur="2.7s" repeatCount="indefinite" begin="0.8s"/>API</text>
    <text x="302" y="0"><animate attributeName="y" values="-400;420" dur="3.4s" repeatCount="indefinite" begin="1.3s"/>11001</text>
    <text x="326" y="0"><animate attributeName="y" values="-390;420" dur="2.3s" repeatCount="indefinite" begin="0.15s"/>C++</text>
  </g>

  <rect width="360" height="420" rx="16" fill="url(#fadeTop)"/>

  <!-- centered terminal identity card -->
  <rect x="55" y="150" width="250" height="120" rx="10" fill="#0d0208" stroke="#00FF41" stroke-width="1.5" opacity="0.95"/>
  <circle cx="180" cy="190" r="26" fill="none" stroke="#00FF41" stroke-width="2"/>
  <text x="180" y="198" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" fill="#00FF41" filter="url(#glow)">AI</text>
  <text x="180" y="235" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#00FF41" filter="url(#glow)">ALI_IRTZA.exe</text>
  <text x="180" y="254" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3d7a3d">[ RUNNING ]</text>

  <rect x="55" y="150" width="250" height="120" rx="10" fill="none" stroke="#00FF41" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
